name: Build Lucid Type

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            eb_flags: ""
          - os: windows-latest
            target: windows-x64
            eb_flags: "--x64"
          - os: windows-11-arm
            target: windows-arm64
            eb_flags: "--arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: bin/models
          key: whisper-model-ggml-base.en

      - name: Cache whisper.cpp CLI
        uses: actions/cache@v4
        with:
          path: |
            bin/whisper-cli
            bin/whisper-cli.exe
          key: whisper-cli-${{ matrix.target }}-v1.9.3

      - name: Install dependencies
        run: npm ci

      - name: Fetch whisper model
        run: npm run fetch:model

      - name: Build whisper.cpp CLI
        shell: bash
        run: npm run fetch:whisper

      - name: Lint
        if: matrix.target == 'macos'
        run: npm run lint

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

      - name: Package Lucid Type
        run: npx electron-builder --publish never ${{ matrix.eb_flags }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload on a tag build — that's the only run that publishes a
      # release. Branch/PR builds still compile + package to catch breakage,
      # but store nothing.
      - name: Upload Lucid Type artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lucid-type-${{ matrix.target }}
          # Installers only — skip *.blockmap sidecars and any archives.
          path: |
            dist-release/Lucid-Type-*.dmg
            dist-release/Lucid-Type-*.exe
          if-no-files-found: ignore
          # Only needed to hand off to the release job in the same run.
          retention-days: 1
          compression-level: 0

  release:
    name: Release Lucid Type
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lucid Type ${{ github.ref_name }}
          files: |
            artifacts/**/Lucid-Type-*.dmg
            artifacts/**/Lucid-Type-*.exe
          fail_on_unmatched_files: false
