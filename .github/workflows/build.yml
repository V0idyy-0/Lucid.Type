name: Build Lucid Type

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: bin/models
          key: whisper-model-ggml-base.en

      - name: Install dependencies
        run: npm ci

      - name: Fetch whisper model
        run: npm run fetch:model

      - name: Lint
        run: npm run lint

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

      - name: Package Lucid Type
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lucid Type artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lucid-type-${{ matrix.os }}
          path: |
            dist-release/Lucid-Type-*.*
          if-no-files-found: ignore

  release:
    name: Release Lucid Type
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lucid Type ${{ github.ref_name }}
          files: artifacts/**/Lucid-Type-*.*
          fail_on_unmatched_files: false
