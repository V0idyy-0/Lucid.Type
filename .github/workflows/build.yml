name: Build Lucid Type

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

# Cancel superseded runs (e.g. a force-push or a follow-up commit on the
# same PR) instead of letting them burn minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap sanity check for PRs: compile + lint on a single Linux runner
  # (1x minute multiplier) instead of the full macOS/Windows package
  # matrix that only push/tag builds need.
  pr-check:
    name: PR check (lint + build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

  build:
    name: Build (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            eb_flags: ""
          # One combined Windows installer with BOTH x64 and arm64 payloads.
          # Built on a native ARM64 runner: arm64 compiles natively (clang-cl),
          # and x64 cross-compiles and still runs under x64 emulation for the
          # smoke test. A single installer means a Windows-on-ARM user can never
          # end up with the "arm64-only, nothing extracted" failure — if ARM64
          # detection ever misfires, NSIS falls back to the x64 payload.
          - os: windows-11-arm
            target: windows
            eb_flags: "--x64 --arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: bin/models
          key: whisper-model-ggml-base.en

      - name: Cache whisper.cpp CLI
        uses: actions/cache@v4
        with:
          path: |
            bin/whisper-cli
            bin/whisper-cli-x64.exe
            bin/whisper-cli-arm64.exe
          key: whisper-cli-${{ matrix.target }}-v1.9.3-multiarch

      - name: Install dependencies
        run: npm ci

      - name: Add active-win x64 prebuilt for the combined installer
        if: matrix.target == 'windows'
        shell: bash
        run: |
          # `npm ci` fetched active-win's arm64 prebuilt (this runner is arm64).
          # Fetch the x64 prebuilt too so the x64 payload of the combined
          # installer carries its own native binding. Both bindings live
          # side-by-side under lib/binding/; active-win picks one by process.arch
          # at runtime, and electron-builder ships both.
          cd node_modules/active-win
          npx --yes node-pre-gyp install --target_platform=win32 --target_arch=x64
          echo "active-win bindings present:"
          ls lib/binding/

      - name: Fetch whisper model
        run: npm run fetch:model

      - name: Build whisper.cpp CLI
        shell: bash
        run: npm run fetch:whisper

      - name: Lint
        if: matrix.target == 'macos'
        run: npm run lint

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

      - name: Package Lucid Type
        run: npx electron-builder --publish never ${{ matrix.eb_flags }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Windows package architectures
        if: matrix.target == 'windows'
        run: npm run verify:win -- x64 arm64

      # Upload on tag builds (the release hand-off) and on manual runs
      # (so a maintainer can inspect a packaged installer on demand).
      - name: Upload Lucid Type artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lucid-type-${{ matrix.target }}
          # Installers only — skip *.blockmap sidecars and any archives.
          path: |
            dist-release/Lucid-Type-*.dmg
            dist-release/Lucid-Type-*.exe
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  release:
    name: Release Lucid Type
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lucid Type ${{ github.ref_name }}
          files: |
            artifacts/**/Lucid-Type-*.dmg
            artifacts/**/Lucid-Type-*.exe
          fail_on_unmatched_files: false
